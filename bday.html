<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Surprise 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", sans-serif;
    background: linear-gradient(135deg, #ffd1e8, #d9ccff);
    color: #5d3b58;
    overflow-x: hidden;
}

/* Floating background */
.float {
    position: fixed;
    bottom: -50px;
    font-size: 28px;
    animation: floatUp 8s linear infinite;
    z-index: 0;
}

.f1 { left: 8%; animation-delay: 0s; }
.f2 { left: 25%; animation-delay: 2s; }
.f3 { left: 50%; animation-delay: 4s; }
.f4 { left: 72%; animation-delay: 1s; }
.f5 { left: 90%; animation-delay: 3s; }

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    to {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
    }
}

/* Main container */
.container {
    position: relative;
    z-index: 2;
    width: 92%;
    max-width: 850px;
    margin: auto;
    padding: 50px 15px;
    text-align: center;
}
