<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: "Trebuchet MS", sans-serif;
    background: linear-gradient(135deg, #ffb6d9, #c9b6ff);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Animated background */
body::before {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: #ffffff55;
    border-radius: 50%;
    top: -100px;
    left: -100px;
    animation: glow 5s infinite alternate;
}

body::after {
    content: "";
    position: fixed;
    width: 350px;
    height: 350px;
    background: #ffffff44;
    border-radius: 50%;
    bottom: -150px;
    right: -100px;
    animation: glow 6s infinite alternate-reverse;
}

@keyframes glow {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.5);
    }
}

/* Floating decorations */
.float {
    position: fixed;
    bottom: -60px;
    font-size: 30px;
    animation: floatUp 7s linear infinite;
}

.f1 { left: 8%; animation-delay: 0s; }
.f2 { left: 25%; animation-delay: 2s; }
.f3 { left: 45%; animation-delay: 4s; }
.f4 { left: 70%; animation-delay: 1s; }
.f5 { left: 88%; animation-delay: 3s; }

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    to {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
    }
}

/* Main card */
.card {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 650px;
    padding: 50px 30px;
    text-align: center;

    background: rgba(255,255,255,0.82);
    border-radius: 35px;
    box-shadow: 0 20px 60px #6d416633;

    animation: appear 1.5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.6) rotate(-5deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
}

.sparkles {
    font-size: 32px;
    animation: sparkle 1.5s infinite alternate;
}

@keyframes sparkle {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.2);
    }
}

h1 {
    font-size: clamp(45px, 10vw, 75px);
    margin: 15px 0;
    color: #ed4f91;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

.message {
    font-size: 20px;
    line-height: 1.6;
    color: #603c54;
}

/* Click button */
.open-button {
    display: inline-block;
    margin-top: 25px;
    padding: 17px 38px;

    background: linear-gradient(45deg, #ff4f91, #c85cff);
    color: white;

    text-decoration: none;
